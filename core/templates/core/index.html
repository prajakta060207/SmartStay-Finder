{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="SmartStay Finder helps students compare hostels by location and radius — rent, deposit, food and room-wise vacancy, without multiple visits." />

    <title>SmartStay Finder — Find your next stay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --wood-dark: #14101f;
            --wood-mid: #241f38;
            --wood-light: #392f56;
            --brass: #e0aa4e;
            --glow: #ffdca0;
            --cream: #f6efe0;
            --ink: #1b1533;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--cream);
            background: var(--ink);
        }

        .hero-scene {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background:
                linear-gradient(to bottom, rgba(27, 21, 51, .8), rgba(27, 21, 51, .85)),
                url('{% static "core/images/bgimage.jpg" %}') center/cover no-repeat;
            perspective: 1600px;
        }

        .welcome-content {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .welcome-content h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: clamp(2.3rem, 6vw, 3.75rem);
            margin: 0 0 .75rem;
            text-shadow: 0 2px 14px rgba(0, 0, 0, .5);
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .8s ease .55s, transform .8s ease .55s;
        }

        .welcome-content .tagline {
            font-size: 1.3rem;
            line-height: 1.55;
            max-width: 32rem;
            color: var(--cream);
            text-shadow: 0 1px 10px rgba(0, 0, 0, .5);
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .8s ease .7s, transform .8s ease .7s;
            margin: 0 0 2rem;
        }

        .welcome-content .btn-cta {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .8s ease .85s, transform .8s ease .85s;
        }

        .hero-scene.open .welcome-content h1,
        .hero-scene.open .welcome-content .tagline,
        .hero-scene.open .welcome-content .btn-cta {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-cta {
            display: inline-block;
            padding: .8rem 2.25rem;
            background: var(--brass);
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(224, 170, 78, .35);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .btn-cta:hover,
        .btn-cta:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(224, 170, 78, .45);
            color: var(--ink);
        }

        .door-glow {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at 50% 45%, var(--glow), transparent 55%);
            opacity: 0;
            transition: opacity 1s ease .3s;
            pointer-events: none;
        }

        .hero-scene.open .door-glow {
            opacity: .3;
        }

        .doors {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            cursor: pointer;
        }

        .doors:focus-visible {
            outline: 3px solid var(--brass);
            outline-offset: -6px;
        }

        .door-panel {
            position: relative;
            width: 50%;
            height: 100%;
            background: linear-gradient(160deg, var(--wood-light) 0%, var(--wood-mid) 55%, var(--wood-dark) 100%);
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(.6, 0, .3, 1);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, .4);
        }

        .door-left {
            transform-origin: left center;
            border-right: 1px solid rgba(224, 170, 78, .22);
        }

        .door-right {
            transform-origin: right center;
            border-left: 1px solid rgba(224, 170, 78, .22);
        }

        .door-panel::before {
            content: "";
            position: absolute;
            top: 8%;
            bottom: 8%;
            left: 16%;
            right: 16%;
            border-radius: 10px;
            box-shadow:
                inset 0 0 0 1.5px rgba(224, 170, 78, .16),
                inset 0 8px 18px rgba(0, 0, 0, .5),
                inset 0 -6px 16px rgba(255, 255, 255, .04);
        }

        .doors::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 6px;
            margin-left: -3px;
            background: var(--glow);
            opacity: .5;
            filter: blur(2px);
            z-index: 1;
            transition: opacity .4s ease;
        }

        .hero-scene.open .doors::before {
            opacity: 0;
        }

        .handle {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 11%;
            border-radius: 6px;
            background: linear-gradient(180deg, var(--brass), #a97a2e);
            box-shadow: 0 0 8px rgba(224, 170, 78, .55);
        }

        .door-left .handle {
            right: 9%;
        }

        .door-right .handle {
            left: 9%;
        }

        .hero-scene.open .door-left {
            transform: rotateY(-104deg);
        }

        .hero-scene.open .door-right {
            transform: rotateY(104deg);
        }

        .hint {
            position: absolute;
            bottom: 9%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            margin: 0;
            font-size: .95rem;
            letter-spacing: .03em;
            color: var(--cream);
            opacity: .85;
            animation: pulse 2.2s ease-in-out infinite;
            transition: opacity .4s ease;
            pointer-events: none;
        }

        .hero-scene.open .hint {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .door-panel,
            .door-glow,
            .hint,
            .welcome-content h1,
            .welcome-content .tagline,
            .welcome-content .btn-cta {
                transition-duration: .01ms !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="hero-scene" id="heroScene">

        <div class="welcome-content">
            <h1>SmartStay Finder</h1>
            <p class="tagline">Find nearby hostels with room-level availability and monthly updated photos.
            </p>

            <a href="{% url 'choose_role' %}" class="btn-cta">Get started</a>
        </div>

        <div class="door-glow"></div>

        <div class="doors" id="doors" role="button" tabindex="0" aria-expanded="false" aria-label="Open the doors to enter SmartStay Finder">
            <div class="door-panel door-left"><span class="handle"></span></div>
            <div class="door-panel door-right"><span class="handle"></span></div>
        </div>

        <p class="hint" id="hint">Tap the doors to begin</p>

        <noscript>
            <style>
                .doors,
                .hint {
                    display: none;
                }

                .welcome-content h1,
                .welcome-content .tagline,
                .welcome-content .btn-cta {
                    opacity: 1;
                    transform: none;
                }
            </style>
        </noscript>
    </main>

    <script>
        const scene = document.getElementById('heroScene');
        const doors = document.getElementById('doors');

        function openDoors() {
            scene.classList.add('open');
            doors.setAttribute('aria-expanded', 'true');
            doors.style.pointerEvents = 'none';
        }

        doors.addEventListener('click', openDoors);
        doors.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openDoors();
            }
        });
    </script>

</body>

</html>
