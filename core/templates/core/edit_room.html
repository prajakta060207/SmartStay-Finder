<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartStay Finder — Edit Room</title>
<style>
  :root { --brass:#e0aa4e; --ink:#1b1533; --cream:#f6efe0; --muted:#c7c0da; --error:#e07a5f; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:40px 20px; background: radial-gradient(circle at 30% 20%, #2a2050, var(--ink) 60%); font-family:'Inter',-apple-system,sans-serif; color:var(--cream); }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-family:'Fraunces',Georgia,serif; margin:0 0 6px; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; display:inline-block; margin-bottom:18px; }
  .back:hover { color:var(--brass); }
  .panel { background:rgba(255,255,255,.04); border:1px solid rgba(224,170,78,.25); border-radius:14px; padding:22px 24px; }
  .field { margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input[type=text], input[type=date], input[type=file] { width:100%; padding:10px 14px; border-radius:8px; border:1px solid rgba(224,170,78,.3); background:rgba(0,0,0,.25); color:var(--cream); font-family:inherit; font-size:15px; outline:none; }
  input[type=checkbox] { accent-color: var(--brass); margin-right:8px; }
  a { color: var(--brass); }
  .err { color:var(--error); font-size:12px; margin-top:4px; }
  .submit { background:var(--brass); color:var(--ink); border:none; border-radius:999px; padding:12px 28px; font-size:15px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="{% url 'manage_rooms' hostel.id %}">&larr; Back to rooms</a>
  <h1>Edit Room {{ room.room_number }}</h1>
  <p style="color:var(--muted);margin:0 0 20px;">{{ hostel.name }}</p>
  <div class="panel">
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="err">{{ field.errors|join:", " }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="submit">Save changes</button>
    </form>
  </div>
</div>
</body>
</html>
